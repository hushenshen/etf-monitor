services:
  etf-monitor:
    container_name: etf-monitor
    image: deeplakehss/etf-monitor:latest
    pull_policy: always
    restart: always
    volumes:
      - ./etfs_to_monitor.yml:/app/etfs_to_monitor.yml:ro
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "-u", "etf_monitor.py", "--run"]

  lof-diff-monitor:
    container_name: lof-diff-monitor
    image: deeplakehss/etf-monitor:latest
    pull_policy: always
    restart: always
    volumes:
      - ./lofs_diff_monitor.yml:/app/lofs_diff_monitor.yml:ro
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "-u", "lof_diff_monitor.py", "--run"]

  fund-premium-scanner:
    container_name: fund-premium-scanner
    image: deeplakehss/etf-monitor:latest
    pull_policy: always
    restart: always
    volumes:
      - ./fund_premium_scanner.yml:/app/fund_premium_scanner.yml:ro
      - ./output:/app/output
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "-u", "fund_premium_scanner.py", "--run"]
